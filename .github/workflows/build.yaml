name: Build, Test and Validate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-manifest:
    name: Validate Manifest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate manifest.json
        run: python3 scripts/validate-manifest.py

  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Solution
        run: dotnet build --no-restore --configuration Release

      - name: Run Tests
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Publish Plugin Artifacts
        run: dotnet publish src/Jellyfin.Plugin.TrackMemory/Jellyfin.Plugin.TrackMemory.csproj --configuration Release --output publish

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Jellyfin.Plugin.TrackMemory
          path: publish/
